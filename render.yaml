services:
  - type: web
    name: ihis-ai-healthcare
    runtime: python
    branch: deployment/public-demo
    buildCommand: pip install -r requirements.txt && flask --app run.py db upgrade && python -m scripts.seed_roles && python -m scripts.seed_public_demo
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///ihis.db
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: IHIS_DEMO_USERNAME
        value: demo
      - key: IHIS_DEMO_PASSWORD
        sync: false
      - key: IHIS_DEMO_EMAIL
        value: demo@example.com
